name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    # Must stay in sync with ci.yml -- `published` covers publishing a draft as a pre-release
    # (`prereleased` does not fire for draft publishes), `released` covers publishing a draft
    # as a full release and promoting an existing pre-release so `latest`/`stable` re-tag.
    types:
      - published
      - released
  workflow_dispatch:
    inputs:
      version:
        description: Application version to use when publishing the project
        required: false
      image-tag:
        description: Additional Docker image tag to apply on deployment
        required: false

permissions: {}

# Queue, never cancel, outside of PRs: a cancelled run can leave a tag pointing at a
# half-pushed manifest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the version from Directory.Build.props (see _version.yml)
  version:
    name: Determine version
    # Drops the duplicate `published` run on the draft -> full release path, where
    # `released` fires alongside it and is the type that carries the production steps.
    if: ${{ !(github.event.action == 'published' && github.event.release.prerelease == false) }}
    uses: ./.github/workflows/_version.yml
    permissions:
      contents: read
    with:
      version-override: ${{ inputs.version || '' }}

  # Format and test gate. Only on the publishing paths -- `CI` already runs this on PRs, and
  # the report check run cannot be published twice for the same commit.
  validate:
    name: Validate
    # Second clause drops the duplicate `published` run on the draft -> full release path
    if: ${{ github.event_name != 'pull_request' && !(github.event.action == 'published' && github.event.release.prerelease == false) }}
    uses: ./.github/workflows/_test.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write
    with:
      report-results: false

  # Build the image without pushing just to make sure the dockerfile is valid
  pack:
    name: Build image
    if: ${{ github.event_name == 'pull_request' }}
    needs: version

    strategy:
      matrix:
        app:
          - Api
          #- AdminConsole
          - Self-Host
        include:
          - app: Api
            dockerfile: Api.dockerfile
          #- app: AdminConsole
          #  dockerfile: AdminConsole.dockerfile
          - app: Self-Host
            dockerfile: self-host/Dockerfile

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU emulators
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: >
          docker buildx build .
          --file "${DOCKERFILE}"
          --platform linux/amd64,linux/arm64
          --build-arg VERSION="${VERSION}"
          --output type=tar,dest=image.tar

  # Build, push and sign the image
  deploy:
    name: Deploy image
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - version
      - validate

    strategy:
      fail-fast: false
      matrix:
        app:
          - Api
          #- AdminConsole
          - Self-Host
        include:
          - app: Api
            dockerfile: Api.dockerfile
            name: passwordless-test-api
            title: Passwordless.dev API
            description: Bitwarden Passwordless.dev API
          #- app: AdminConsole
          #  dockerfile: AdminConsole.dockerfile
          #  name: passwordless-test-admin-console
          #  title: Passwordless.dev Admin Console
          #  description: Bitwarden Passwordless.dev Admin Console
          - app: Self-Host
            dockerfile: self-host/Dockerfile
            name: passwordless-self-host
            title: Passwordless.dev Self-Host
            description: Bitwarden Passwordless.dev self-hosted server

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU emulators
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: image-tags
        env:
          IMAGE: ghcr.io/bitwarden/${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          # Always tag with dev
          tags=("$IMAGE:dev")

          if [[ "$EVENT_NAME" == "release" ]]; then
            tags+=("$IMAGE:qa")

            if [[ "$IS_PRERELEASE" != "true" ]]; then
              tags+=("$IMAGE:latest")
              tags+=("$IMAGE:stable")
            fi

            tags+=("$IMAGE:$REF_NAME")
          fi

          if [[ -n "${INPUT_TAG:-}" ]]; then
            tags+=("$IMAGE:$INPUT_TAG")
          fi

          {
            echo "image=$IMAGE"
            echo "tags=$(IFS=,; echo "${tags[*]}")"
          } >> "$GITHUB_OUTPUT"

          echo "Tagging $IMAGE with: ${tags[*]}"

      - name: Build custom image metadata
        id: custom-meta
        env:
          PROJECT_TITLE: ${{ matrix.title }}
          DESCRIPTION: ${{ matrix.description }}
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          {
            echo "items<<METADATA_EOF"
            echo "org.opencontainers.image.title=Bitwarden ${PROJECT_TITLE}"
            echo "org.opencontainers.image.description=${DESCRIPTION}"
            echo "org.opencontainers.image.vendor=Bitwarden Inc."
            echo "org.opencontainers.image.url=https://bitwarden.com/products/passwordless"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${REVISION}"
            echo "METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          labels: ${{ steps.custom-meta.outputs.items }}
          annotations: ${{ steps.custom-meta.outputs.items }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # Replaces Docker Content Trust (Notary v1), which is retired. Keyless signatures are
      # attributable to this workflow and verifiable with `cosign verify`.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign
        env:
          IMAGE: ${{ steps.image-tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Log out from GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
