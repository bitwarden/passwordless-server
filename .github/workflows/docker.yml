name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    # Must stay in sync with ci.yml -- `published` covers publishing a draft (`prereleased`
    # does not fire for draft publishes), `released` covers promoting an existing pre-release.
    # Publishing a full release emits both, so the guard below drops the `published` half and
    # leaves one run to push `latest`/`stable`.
    types:
      - published
      - released
  workflow_dispatch:
    inputs:
      version:
        description: Application version to use when publishing the project
        required: false

permissions: {}

# Queue, never cancel, outside of PRs: a cancelled run can leave a tag pointing at a
# half-pushed manifest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the version from Directory.Build.props (see _version.yml)
  version:
    name: Determine version
    # A full release publish emits both `published` and `released`; skipping the `published`
    # half keeps every release transition resolving to exactly one executing run.
    if: ${{ !(github.event.action == 'published' && github.event.release.prerelease == false) }}
    uses: ./.github/workflows/_version.yml
    permissions:
      contents: read
    with:
      version-override: ${{ inputs.version || '' }}

  # Format and test gate. Only on the publishing paths -- `CI` already runs this on PRs, and
  # the report check run cannot be published twice for the same commit.
  validate:
    name: Validate
    # Second clause is the duplicate-run guard described in the `release` trigger above
    if: ${{ github.event_name != 'pull_request' && !(github.event.action == 'published' && github.event.release.prerelease == false) }}
    uses: ./.github/workflows/_test.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write
    with:
      report-results: false

  # Build the image without pushing just to make sure the dockerfile is valid
  pack:
    name: Build image
    if: ${{ github.event_name == 'pull_request' }}
    needs: version

    strategy:
      matrix:
        app:
          - Api
          #- AdminConsole
          - Self-Host
        include:
          - app: Api
            dockerfile: Api.dockerfile
          #- app: AdminConsole
          #  dockerfile: AdminConsole.dockerfile
          - app: Self-Host
            dockerfile: self-host/Dockerfile

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU emulators
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: >
          docker buildx build .
          --file "${DOCKERFILE}"
          --platform linux/amd64,linux/arm64
          --build-arg VERSION="${VERSION}"
          --output type=tar,dest=image.tar

  # Build, push and sign the image
  deploy:
    name: Deploy image
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - version
      - validate

    strategy:
      fail-fast: false
      matrix:
        app:
          - Api
          #- AdminConsole
          - Self-Host
        include:
          - app: Api
            dockerfile: Api.dockerfile
            name: passwordless-test-api
            title: Passwordless.dev API
            description: Bitwarden Passwordless.dev API
          #- app: AdminConsole
          #  dockerfile: AdminConsole.dockerfile
          #  name: passwordless-test-admin-console
          #  title: Passwordless.dev Admin Console
          #  description: Bitwarden Passwordless.dev Admin Console
          - app: Self-Host
            dockerfile: self-host/Dockerfile
            name: passwordless-self-host
            title: Passwordless.dev Self-Host
            description: Bitwarden Passwordless.dev self-hosted server

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU emulators
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each moving tag tracks the environment its ci.yml deploy job targets, under the same
      # condition: dev -> devtest (every run), qa -> qa (any release), stable/latest -> prod
      # (`released` only). The version tag comes from the release's git tag, and only on release
      # events so a manual run from a tag ref cannot overwrite a release image. The multi-platform
      # build publishes an image index, so annotations go on both levels.
      - name: Generate image metadata
        id: meta
        uses: bitwarden/gh-actions/container-image-metadata@main
        with:
          images: ghcr.io/bitwarden/${{ matrix.name }}
          flavor: latest=${{ github.event.action == 'released' }}
          tags: |
            type=raw,value=dev
            type=raw,value=qa,enable=${{ github.event_name == 'release' }}
            type=raw,value=stable,enable=${{ github.event.action == 'released' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
          title: Bitwarden ${{ matrix.title }}
          version: ${{ needs.version.outputs.version }}
          description: ${{ matrix.description }}
          url: https://bitwarden.com/products/passwordless
          annotation-levels: index,manifest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # Replaces Docker Content Trust (Notary v1), which is retired. Keyless signatures are
      # attributable to this workflow and verifiable with `cosign verify`.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign
        env:
          IMAGE: ghcr.io/bitwarden/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Log out from GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
