name: Migrations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    # Kept in sync with main.yml and docker.yml so the scripts are regenerated on every
    # release path, including promoting an existing pre-release to a full release.
    types:
      - prereleased
      - released
  workflow_dispatch:

env:
  # Setting these variables allows .NET CLI to use rich color codes in console output
  TERM: xterm
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Skip boilerplate output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script:
    name: Generate idempotent migrations
    strategy:
      matrix:
        app:
          - Api
          - AdminConsole
        include:
          - app: Api
            ef-context: DbGlobalMsSqlContext
          - app: AdminConsole
            ef-context: MssqlConsoleDbContext

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0

      - name: Install Entity Framework toolkit
        run: dotnet tool install dotnet-ef --global

      - name: Restore
        env:
          APP: ${{ matrix.app }}
        run: dotnet restore "src/${APP}"

      - name: Generate script
        env:
          APP: ${{ matrix.app }}
          EF_CONTEXT: ${{ matrix.ef-context }}
        run: >
          dotnet ef migrations script
          --configuration Release
          --project "src/${APP}"
          --context "${EF_CONTEXT}"
          --idempotent
          --output "${APP}.sql"

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.app }}-${{ matrix.ef-context }}
          path: ${{ matrix.app }}.sql

      - name: Produce summary
        env:
          APP: ${{ matrix.app }}
          EF_CONTEXT: ${{ matrix.ef-context }}
        run: |
          {
            echo "### Idempotent migrations for ${APP} (${EF_CONTEXT})"
            echo "\`\`\`sql"
            cat "${APP}.sql"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
