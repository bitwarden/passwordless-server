name: Migrations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    # Kept in sync with ci.yml and docker.yml so the scripts are regenerated on every release
    # path: `published` for a draft being published (`prereleased` does not fire for draft
    # publishes) and `released` for promoting an existing pre-release.
    types:
      - published
      - released
  workflow_dispatch:

env:
  # Setting these variables allows .NET CLI to use rich color codes in console output
  TERM: xterm
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Skip boilerplate output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script:
    name: Generate idempotent migrations
    strategy:
      matrix:
        app:
          - Api
          - AdminConsole
        include:
          - app: Api
            ef-context: DbGlobalMsSqlContext
          - app: AdminConsole
            ef-context: MssqlConsoleDbContext

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Install Entity Framework toolkit
        run: dotnet tool install dotnet-ef --global

      - name: Restore
        env:
          APP: ${{ matrix.app }}
        run: dotnet restore "src/${APP}"

      - name: Generate script
        env:
          APP: ${{ matrix.app }}
          EF_CONTEXT: ${{ matrix.ef-context }}
        run: >
          dotnet ef migrations script
          --configuration Release
          --project "src/${APP}"
          --context "${EF_CONTEXT}"
          --idempotent
          --output "${APP}.sql"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app }}-${{ matrix.ef-context }}
          path: ${{ matrix.app }}.sql

      - name: Produce summary
        env:
          APP: ${{ matrix.app }}
          EF_CONTEXT: ${{ matrix.ef-context }}
        run: |
          {
            echo "### Idempotent migrations for ${APP} (${EF_CONTEXT})"
            echo "\`\`\`sql"
            cat "${APP}.sql"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
